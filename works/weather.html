<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>uncool's hideout</title>
        <link href="../style.css" rel="stylesheet" type="text/css" media="all">
        <style>
            .main-content-section{
                box-sizing: border-box;
                max-width: 1100px;
            }
            .main-content-section iframe{
                display: block;
                width: 100%;
                max-width: 640px;
                height: auto;
                aspect-ratio: 16 / 9;
            }

            @media (max-width: 900px){
                .main-content-section{
                    width: 90%;
                }
            }

            @media (max-width: 600px){
                h1{
                    font-size: 36px;
                }
                .main-content-section{
                    width: 100%;
                    padding: 18px;
                }
                .main-content-section > div{
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <h1 style="text-align: center; color:aliceblue;">Weather (2025)</h1>
        <div class="content-container">
            <div class="content main-content-section">
                <div style="display: flex; justify-content: center">
                   <iframe title="vimeo-player" src="https://player.vimeo.com/video/1054330100?h=75f88d9c1d" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
                </div>

                <p>A piece combining 3D animated characters with digital video feedback techniques. Programs used: Blender, Davinci resolve, and OBS Studio.</p>
                <a href="../gallery.html">take me back to the gallery</a>
        </div>
    </body>
</html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>uncool's hideout</title>
        <link href="../style.css" rel="stylesheet" type="text/css" media="all">
        <style>
            .main-content-section{
                box-sizing: border-box;
                max-width: 1100px;
            }
            .gallery{
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .gallery img{
                width: 100%;
                max-width: 300px;
                height: auto;
            }
            .main-content-section > div[style*="flex-direction: row"]{
                flex-wrap: wrap;
                justify-content: center;
            }
            .main-content-section > div[style*="flex-direction: row"] img{
                max-width: calc(100% - 24px);
                height: auto;
            }

            @media (max-width: 1000px){
                .main-content-section{
                    width: 90%;
                }
                .gallery{
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    gap: 18px;
                }
            }

            @media (max-width: 600px){
                h1{
                    font-size: 36px;
                }
                .main-content-section{
                    width: 100%;
                    padding: 18px;
                }
                .gallery{
                    grid-template-columns: minmax(0, 1fr);
                    gap: 16px;
                }
                .main-content-section > div[style*="flex-direction: row"]{
                    flex-direction: column !important;
                    align-items: center;
                }
            }
        </style>
    </head>
    <body>
        <h1 style="text-align: center; color:aliceblue;">Adventures in Shapes and Space (2022)</h1>
        <div class="content-container">
            <div class="content main-content-section">
                <p>A live painting performance done at South Bend Fringe Fest in 2022.</p>
                <div class="gallery">
                    <img src="../img/gallery/shapes_space/shapes1.png" />
                    <img src="../img/gallery/shapes_space/shapes2.png" />
                    <img src="../img/gallery/shapes_space/shapes3.png" />
                </div>
                

                <p><b>Bonus:</b> Pics of the artist in action:</p>
                <div style="display: flex; flex-direction: row">
                    <img src="../img/gallery/shapes_space/shapes5.jpg" style="margin: 12px;"/>
                    <img src="../img/gallery/shapes_space/shapes6.jpg" style="margin: 12px;"/>
                </div>
                <a style="margin-top: 24px;" href="../gallery.html">take me back to the gallery</a>
            </div>  


        </div>
    </body>
</html>

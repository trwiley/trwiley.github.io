<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>uncool's hideout</title>
        <link href="../style.css" rel="stylesheet" type="text/css" media="all">
        <style>
            .gallery{
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 24px; /* Adjust the gap between grid items */
            }
            .gallery img{
                width: 100% !important;
                max-width: 450px;
                height: auto;
            }
            .main-content-section{
                box-sizing: border-box;
                max-width: 1100px;
            }

            body{
                background-image: url("../img/building.png");
            }

            @media (max-width: 900px){
                .main-content-section{
                    width: 90%;
                }
                .gallery{
                    gap: 18px;
                }
            }

            @media (max-width: 600px){
                h1{
                    font-size: 36px;
                }
                .main-content-section{
                    width: 100%;
                    padding: 18px;
                }
                .gallery{
                    grid-template-columns: minmax(0, 1fr);
                    gap: 16px;
                }
            }

        </style>
    </head>
    <body>
        <h1 style="text-align: center; color:aliceblue;">Various Glitch Pieces (2024-2025)</h1>
        <div class="content-container">
            <div class="content main-content-section">
                <p>Various glitch art pieces I created from pictures I all took myself. All of these images have been modified using Audacity. The more recent pieces at the top were also modified with a hex editor.</p>
                <div class="gallery">

                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/pipe3.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/plant_fixed.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/sky.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/test3.png" />

                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/alleyway.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/bridge.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/antenna.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/crossing.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/trees.png" />
                    <img style="width: 450px; height: auto;" src="../img/gallery/glitch_art/building.png" />
                </div>
                <a style="margin-top: 24px;" href="../gallery.html">take me back to the gallery</a>
               
            </div>  


        </div>
    </body>
</html>
